name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Package
        run: |
          tar -czf backend.tgz --exclude=node_modules --exclude=.env -C backend .
          tar -czf frontend.tgz -C frontend/dist .
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            backend.tgz
            frontend.tgz
          retention-days: 3

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Set up SSH
        env:
          KEY: ${{ secrets.EC2_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "ec2-user@$HOST" 'mkdir -p ~/release'
          scp -i ~/.ssh/id_deploy -o BatchMode=yes backend.tgz frontend.tgz "ec2-user@$HOST:release/"
      - name: Deploy and check
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "ec2-user@$HOST" 'bash -s' <<'REMOTE'
          set -eu
          app=/home/ec2-user/mern_stack/backend
          web=/var/www/expiryalert
          # The server's own .env is never in the package, so it is kept.
          tar -xzf ~/release/backend.tgz -C "$app"
          cd "$app"
          npm ci --omit=dev --no-audit --no-fund </dev/null
          pm2 restart backend </dev/null
          tar -xzf ~/release/frontend.tgz -C "$web"
          for i in $(seq 1 15); do
            if curl -fsS -m 5 http://127.0.0.1/api/dashboard/stats >/dev/null; then
              echo "Deployed and healthy"
              exit 0
            fi
            sleep 2
          done
          echo "The API or database check failed" >&2
          pm2 list
          exit 1
          REMOTE
